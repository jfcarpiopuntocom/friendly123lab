name: One-shot v614 snapshot for Greptile
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-v614.yml"
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy exact public source snapshot, without original Git history
        shell: bash
        env:
          SOURCE_SHA: e1486ae4ba78c9437adc52ecae7ceeb14480a9a9
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/jfcarpiopuntocom/friendly-123.git "$RUNNER_TEMP/f123-source"
          git -C "$RUNNER_TEMP/f123-source" checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/f123-source" rev-parse HEAD)" = "$SOURCE_SHA"
          rsync -a --delete \
            --exclude='/.git/' --exclude='/.github/' --exclude='/.claude/' \
            --exclude='**/.env*' --exclude='**/private/' --exclude='**/*.pem' --exclude='**/*.key' \
            "$RUNNER_TEMP/f123-source/" "./"
          rm -f ".github/workflows/one-shot-v614.yml"
          cat > LAB-SNAPSHOT.md <<'NOTE'
          # friendly-123 — v614 source snapshot for Greptile
          Source repository: jfcarpiopuntocom/friendly-123
          Source candidate commit: e1486ae4ba78c9437adc52ecae7ceeb14480a9a9
          Source pull request: https://github.com/jfcarpiopuntocom/friendly-123/pull/463
          This is a one-time detached source snapshot for code review, not the production deployment.
          Exclusions: original .git history, GitHub workflow definitions, .claude agent files,
          and common private/key/environment paths. The runtime code and release manifest are preserved.
          No synchronization between repositories is configured.
          NOTE
          test -f docs/version.json && grep -q '"shell": "f123-shell-v614"' docs/version.json
          test -f docs/version-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot v614 for one-time Greptile review (source e1486ae4)" 
          git push origin HEAD:main
