name: One-time P0 isolated tests on integrated v614
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-shot-p0-verify.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Three targeted durable recovery tests on exact source SHA
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/jfcarpiopuntocom/friendly-123.git /tmp/f123-check
          git -C /tmp/f123-check checkout --quiet --detach d6a2a85365c5f10729f9b20de0081fc1f1071487
          cd /tmp/f123-check
          npm ci --silent
          for t in test/hechos-import-recovery.test.cjs test/incident-v604-selective-apply-retry.test.cjs test/yjs-autorecovery-native.test.cjs; do
            echo "TARGET_TEST: $t"
            node --require ./test/helpers/sin-red-produccion.cjs --test --test-timeout=120000 "$t"
          done
      - name: Retire temporary workflow even if tests fail
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-p0-verify.yml
          git add -A
          git commit -m "chore: retire one-time v614 P0 test workflow"
          git push origin HEAD:main
      - name: Stop on real target failure
        if: always()
        env:
          RESULT: ${{ steps.tests.outcome }}
        run: test "$RESULT" = success
